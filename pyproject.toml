[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data", "docs", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = '(?x)(^\.venv/|^data/|^migrations/versions/)'

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  ".venv/*",
  "tests/*",
  "migrations/*",
  "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 45
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "data", "docs"]
skips = ["B101"]
