name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FACAI_AUTH_ENABLED: "0"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked application dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install pinned quality tools
        shell: pwsh
        run: python -m pip install -r requirements-ci.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q .

      - name: Ruff changed security and infrastructure surface
        shell: pwsh
        run: >-
          ruff check database.py main.py services/security.py services/access_control.py
          services/backup_manager.py services/bounded_executor.py services/readiness.py
          services/job_runs.py services/request_context.py services/secret_store.py services/task_queue.py
          services/upload_validation.py scripts/bootstrap_auth.py scripts/runtime_environment.py
          scripts/facai_agent_service.py scripts/facai_server.py migrations
          tests/test_security_hardening.py tests/test_access_control.py
          tests/test_alembic_migrations.py tests/test_auth_bootstrap.py
          tests/test_backup_manager.py tests/test_job_runs.py tests/test_service_runtime.py
          tests/test_upload_validation.py

      - name: Incremental type checks
        shell: pwsh
        run: >-
          mypy services/security.py services/request_context.py services/secret_store.py
          services/upload_validation.py services/bounded_executor.py scripts/verify_runtime.py

      - name: Bandit security scan
        shell: pwsh
        run: >-
          bandit -q services/security.py services/access_control.py services/backup_manager.py
          services/job_runs.py services/secret_store.py services/task_queue.py
          services/upload_validation.py

      - name: Semgrep high-confidence policies
        shell: pwsh
        run: >-
          semgrep scan --config .semgrep.yml --error --no-git-ignore
          --exclude .venv --exclude .ci-venv --exclude node_modules --exclude data

      - name: Backend tests and coverage floor
        shell: pwsh
        run: >-
          coverage run -m unittest discover -s tests -v;
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE };
          coverage report --fail-under=45

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        shell: pwsh
        run: npm.cmd ci --registry=https://registry.npmjs.org

      - name: Install Playwright Chromium
        shell: pwsh
        run: npx.cmd playwright install chromium

      - name: Browser regression tests
        shell: pwsh
        run: npm.cmd run test:e2e

      - name: Dependency vulnerability audits
        shell: pwsh
        run: >-
          pip-audit --require-hashes -r requirements.lock;
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE };
          npm.cmd audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Whitespace errors in committed changes
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
