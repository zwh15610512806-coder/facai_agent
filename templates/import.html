<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数据导入 — 抖音运营agent</title>
<link rel="stylesheet" href="/static/css/style.css?v=app-shell-20260720-2">
<script src="/static/vendor/lucide.min.js"></script>
<style>
.import-main{max-width:1680px}
.import-workspace{display:grid;grid-template-columns:repeat(3,minmax(320px, 1fr));gap:22px;align-items:start}
.result-card{padding:12px 16px;background:var(--facai-soft);border-radius:var(--r);font-size:13px;color:var(--facai)}
.result-card.error{background:var(--danger-soft);color:var(--danger)}
.result-detail-list{margin-top:10px;display:grid;gap:6px;color:var(--text-2)}
.result-detail-list h4{margin:0;font-size:12px;color:var(--text-3)}
.result-detail-list ul{margin:0;padding-left:18px;display:grid;gap:4px}
.product-import-actions,.txt-script-actions{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.product-import-actions .btn,.txt-script-actions .btn{flex:1}
@media (max-width: 768px) {
  main.page-main > div, .import-workspace { grid-template-columns: 1fr !important; gap: 14px !important; }
  main.page-main > div .card:nth-child(2) > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  main.page-main > div .btn { width: 100%; }
}
</style>
</head>
<body>

<nav class="nav">
<div class="nav-inner">
<div class="nav-brand-group">
<a href="/app" class="nav-brand"><span class="nav-brand-mark"><img src="/static/images/douyin-logo.svg" alt="抖音"></span><span>抖音运营agent</span></a>
</div>
<div class="nav-links">
<a href="/app" class="nav-link">AI工作</a><a href="/app/generate" class="nav-link">生成脚本</a><a href="/app/rewrite" class="nav-link">脚本改写</a><a href="/app/products" class="nav-link">产品知识库</a><a href="/app/creators" class="nav-link">达人工作</a><a href="/app/operations" class="nav-link">运营数据中台</a><a href="/app/templates" class="nav-link">脚本模板库</a><a href="/app/history" class="nav-link">生成历史</a>
<a href="/app/search" class="nav-link">检索</a>
</div></div></nav>

<main class="page-main import-main">
<header class="page-hd"><h1>数据导入</h1><p>CSV/Excel 批量导入产品数据，或直接粘贴脚本</p></header>

<div class="import-workspace">

<!-- CSV/Excel -->
<div class="card" id="productImportPanel">
<h2 style="margin-bottom:16px">批量导入产品 (CSV/Excel/Markdown)</h2>
<div id="productDrop" class="drop" role="button" tabindex="0" aria-controls="productFile" aria-label="选择产品导入文件" style="margin-bottom:14px">
<i data-lucide="file-up" style="width:40px;height:40px;margin-bottom:10px;color:var(--text-3)"></i>
<p style="font-weight:600;color:var(--text-2);font-family:var(--font-ui)">拖拽文件或点击选择</p>
<p style="font-size:13px;color:var(--text-3);margin-top:6px">支持 .csv / .xlsx / .md / .markdown，Markdown 可多选并自动新增或更新产品</p>
<input type="file" id="productFile" style="position:absolute;width:1px;height:1px;opacity:0" accept=".csv,.xlsx,.md,.markdown" multiple>
</div>
<div class="product-import-actions">
<button type="button" id="btnScanLocalProducts" class="btn btn-soft" onclick="scanLocalProducts()"><i data-lucide="folder-search"></i>扫描本地产品资料</button>
</div>
<div id="productProgress" style="text-align:center;font-size:13px;color:var(--facai);display:none;margin-bottom:12px"></div>
<div id="productResult"></div>
</div>

<!-- 脚本导入 -->
<div class="card" id="txtBatchPanel">
<h2 style="margin-bottom:16px">脚本导入</h2>
<div id="txtScriptDrop" class="drop" role="button" tabindex="0" aria-controls="txtScriptFiles" aria-label="选择 txt 脚本文件" style="margin-bottom:14px">
<i data-lucide="files" style="width:38px;height:38px;margin-bottom:10px;color:var(--text-3)"></i>
<p style="font-weight:600;color:var(--text-2);font-family:var(--font-ui)">批量上传 txt 脚本</p>
<p style="font-size:13px;color:var(--text-3);margin-top:6px">可多选 .txt 文件，文件名会作为脚本标题</p>
<input type="file" id="txtScriptFiles" style="position:absolute;width:1px;height:1px;opacity:0" accept=".txt,text/plain" multiple>
</div>
<div class="txt-script-actions">
<button type="button" id="btnScanLocalTxtScripts" class="btn btn-soft" onclick="scanLocalTxtScripts()"><i data-lucide="folder-search"></i>扫码本地脚本</button>
</div>
<div id="txtScriptProgress" style="text-align:center;font-size:13px;color:var(--facai);display:none;margin-bottom:12px"></div>
<div id="txtScriptResult"></div>
</div>

<div class="card" id="singleScriptPanel">
<h2 style="margin-bottom:16px">单条脚本导入</h2>
<div style="margin-bottom:12px">
<label style="display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px">脚本内容</label>
<textarea id="scriptContent" class="so-input" rows="8" placeholder="粘贴脚本内容（支持带时间戳格式，自动清洗为段落）&#10;&#10;示例：&#10;【开场钩子-0-3s】才X毛多一套！&#10;【痛点-3-10s】刀软切不动...&#10;&#10;保存后自动变为：&#10;才X毛多一套！刀软切不动..."></textarea>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
<div><label style="display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px">标题</label><input id="scriptTitle" class="input" style="font-size:13px" placeholder="选填"></div>
<div><label style="display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px">品类</label><select id="scriptCategory" class="input" style="font-size:13px"><option>烘焙调色</option><option>烘焙装饰</option><option>烘焙调味</option><option>烘焙夹心</option><option selected>烘焙配件</option></select></div>
</div>
<button class="btn btn-pri" onclick="importScript()">导入脚本</button>
<p style="font-size:12px;color:var(--text-3);margin-top:8px">带时间戳、镜头指令的脚本会自动格式化为干净段落保存</p>
<div id="scriptResult" style="margin-top:12px"></div>
</div>

</div>
</main>

<script src="/static/js/common.js?v=app-shell-20260720-2"></script>
<script>
function toast(msg,type){var e=document.createElement('div');e.className='toast toast-'+(type==='success'?'ok':'err');e.textContent=(type==='success'?'OK ':'!! ')+msg;document.body.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(function(){e.remove()},300)},2000);}
var escHtml=FacaiUI.escHtml;
var localProductScanTimer=null;
var localProductScanFailures=0;
var localTxtScanTimer=null;
var localTxtScanFailures=0;

function renderResultList(key,title,items,formatter){
 if(!items||!items.length)return '';
 return '<div class="result-detail-list result-'+key+'"><h4>'+escHtml(title)+'（'+items.length+'）</h4><ul>'+items.map(function(item){return '<li>'+escHtml(formatter?formatter(item):item)+'</li>';}).join('')+'</ul></div>';
}

function renderProductImportResult(d,type){
 d=d||{};
 var summary=type==='markdown'
  ? '总计 '+(d.total||0)+'，新增 '+(d.created||0)+'，更新 '+(d.updated||0)+'，跳过 '+(d.skipped||0)
  : '总计 '+(d.total||0)+'，成功 '+(d.success||0)+'，跳过 '+(d.skipped||0);
 var html='<div class="result-card'+((d.errors&&d.errors.length)?' error':'')+'"><strong>'+escHtml(summary)+'</strong>';
 html+=renderResultList('products','产品明细',d.products||[],function(p){return (p.name||p.product_name||'未命名产品')+' - '+(p.action||p.status||'已处理');});
 html+=renderResultList('warnings','待确认',d.warnings||[]);
 html+=renderResultList('errors','错误',d.errors||[]);
 html+='</div>';
 document.getElementById('productResult').innerHTML=html;
}

function activateDropZoneFileInput(e,inputId){if(e.key==='Enter'||e.key===' '){e.preventDefault();document.getElementById(inputId).click();}}
var dz=document.getElementById('productDrop');dz.addEventListener('click',function(){document.getElementById('productFile').click();});
dz.addEventListener('keydown',function(e){activateDropZoneFileInput(e, 'productFile');});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.style.borderColor='var(--facai)';dz.style.background='var(--facai-ghost)';});
dz.addEventListener('dragleave',function(){dz.style.borderColor='var(--border)';dz.style.background='';});
dz.addEventListener('drop',function(e){e.preventDefault();dz.style.borderColor='var(--border)';dz.style.background='';if(e.dataTransfer.files.length>0)uploadProductFiles(e.dataTransfer.files);});
document.getElementById('productFile').addEventListener('change',function(e){if(e.target.files.length>0)uploadProductFiles(e.target.files);});

var txtDz=document.getElementById('txtScriptDrop');
txtDz.addEventListener('click',function(){document.getElementById('txtScriptFiles').click();});
txtDz.addEventListener('keydown',function(e){activateDropZoneFileInput(e, 'txtScriptFiles');});
txtDz.addEventListener('dragover',function(e){e.preventDefault();txtDz.style.borderColor='var(--facai)';txtDz.style.background='var(--facai-ghost)';});
txtDz.addEventListener('dragleave',function(){txtDz.style.borderColor='var(--border)';txtDz.style.background='';});
txtDz.addEventListener('drop',function(e){e.preventDefault();txtDz.style.borderColor='var(--border)';txtDz.style.background='';if(e.dataTransfer.files.length>0)uploadTxtScriptFiles(e.dataTransfer.files);});
document.getElementById('txtScriptFiles').addEventListener('change',function(e){if(e.target.files.length>0)uploadTxtScriptFiles(e.target.files);});

function isMarkdownProductFile(file){var name=(file&&file.name||'').toLowerCase();return name.endsWith('.md')||name.endsWith('.markdown');}
async function uploadProductFiles(files){var list=Array.prototype.slice.call(files||[]);if(!list.length)return;var markdown=list.filter(isMarkdownProductFile);if(markdown.length){if(markdown.length!==list.length)return toast('Markdown 请单独批量上传','error');return uploadMarkdownProductFiles(markdown);}if(list.length>1)return toast('CSV/Excel 一次只能上传 1 个文件','error');return uploadProductFile(list[0]);}
async function uploadProductFile(file){if(isMarkdownProductFile(file))return uploadMarkdownProductFiles([file]);var p=document.getElementById('productProgress');p.style.display='';p.textContent='导入中&hellip;';var fd=new FormData();fd.append('file',file);var name=file.name.toLowerCase();if(name.endsWith('.xls')){toast('Excel 仅支持 .xlsx 文件','error');renderProductImportResult({total:0,success:0,skipped:0,errors:['Excel 仅支持 .xlsx 文件']},'table');p.style.display='none';return;}var url=name.endsWith('.xlsx')?'/api/import/excel':'/api/import/csv';try{var r=await fetch(url,{method:'POST',body:fd});var d=await r.json();if(r.ok){toast('导入成功','success');renderProductImportResult(d,'table');}else{var msg=d.detail||d.message||'导入失败';toast(msg,'error');renderProductImportResult({total:0,success:0,skipped:0,errors:[msg]},'table');}}catch(e){toast('失败','error');renderProductImportResult({total:0,success:0,skipped:0,errors:[e.message||'网络错误']},'table');}p.style.display='none';}
async function uploadMarkdownProductFiles(files){var p=document.getElementById('productProgress');p.style.display='';p.textContent='同步 Markdown 产品中&hellip;';var fd=new FormData();files.forEach(function(file){fd.append('files',file);});try{var r=await fetch('/api/import/markdown',{method:'POST',body:fd});var d=await r.json();if(r.ok){toast('同步完成','success');renderProductImportResult(d,'markdown');document.getElementById('productFile').value='';}else{var msg=d.detail||d.message||'同步失败';toast(msg,'error');renderProductImportResult({total:files.length,created:0,updated:0,skipped:0,errors:[msg]},'markdown');}}catch(e){toast('失败','error');renderProductImportResult({total:files.length,created:0,updated:0,skipped:0,errors:[e.message||'网络错误']},'markdown');}p.style.display='none';}

function renderLocalProductScanState(d,type){d=d||{};var running=!!d.is_running;var summary='总计 '+(d.total||0)+'，已处理 '+(d.processed||0)+'，新增 '+(d.created||0)+'，更新 '+(d.updated||0)+'，附件 '+(d.attached||0)+'，跳过 '+(d.skipped||0)+'，不支持 '+(d.unsupported||0)+'，错误 '+(d.error_count||0);var html='<div class="result-card'+(type==='error'||(d.error_count||0)>0?' error':'')+'"><strong>'+escHtml(summary)+'</strong>';if(d.message)html+='<div style="margin-top:6px;color:inherit">'+escHtml(d.message)+'</div>';html+=renderResultList('errors','错误明细',d.errors||[]);html+='</div>';document.getElementById('productResult').innerHTML=html;var btn=document.getElementById('btnScanLocalProducts');if(btn){btn.disabled=running;btn.innerHTML=(running?'<i data-lucide="loader"></i>扫描中':'<i data-lucide="folder-search"></i>扫描本地产品资料');if(window.lucide)lucide.createIcons();}var p=document.getElementById('productProgress');p.style.display=running?'':'none';p.textContent=running?'扫描中，正在同步产品资料...':'';}
async function pollLocalProductScanStatus(){try{var r=await fetch('/api/import/scan-local-products/status',{headers:{'Accept':'application/json'}});var d=await readJsonResponse(r);localProductScanFailures=0;var data=d.data||{};renderLocalProductScanState(data,(data.error_count||0)>0?'error':'success');if(!data.is_running&&localProductScanTimer){clearInterval(localProductScanTimer);localProductScanTimer=null;toast('本地产品资料扫描完成','success');}}catch(e){localProductScanFailures+=1;renderProductImportResult({total:0,success:0,skipped:0,errors:['服务连接不稳定，稍后自动重试（'+localProductScanFailures+'/5）：'+e.message]},'table');if(localProductScanFailures<5)return;if(localProductScanTimer){clearInterval(localProductScanTimer);localProductScanTimer=null;}var btn=document.getElementById('btnScanLocalProducts');if(btn)btn.disabled=false;document.getElementById('productProgress').style.display='none';}}
async function scanLocalProducts(){var btn=document.getElementById('btnScanLocalProducts');if(btn)btn.disabled=true;var p=document.getElementById('productProgress');p.style.display='';p.textContent='扫描启动中...';localProductScanFailures=0;try{var r=await fetch('/api/import/scan-local-products',{method:'POST',headers:{'Accept':'application/json'}});var d=await readJsonResponse(r);if(r.ok){renderLocalProductScanState(d.data||{},'success');toast(d.message||'扫描已启动','success');if(localProductScanTimer)clearInterval(localProductScanTimer);localProductScanTimer=setInterval(pollLocalProductScanStatus,2000);pollLocalProductScanStatus();}else{if(btn)btn.disabled=false;p.style.display='none';renderProductImportResult({total:0,success:0,skipped:0,errors:[d.detail||'扫描启动失败']},'table');toast('失败','error');}}catch(e){if(btn)btn.disabled=false;p.style.display='none';renderProductImportResult({total:0,success:0,skipped:0,errors:['扫描启动失败：'+e.message]},'table');toast('失败','error');}}

function showScriptImportResult(msg,type){var box=document.createElement('div');box.style.padding='12px 16px';box.style.background=type==='error'?'var(--danger-soft)':'var(--facai-soft)';box.style.borderRadius='var(--r)';box.style.fontSize='13px';box.style.color=type==='error'?'var(--danger)':'var(--accent)';box.textContent=msg;var target=document.getElementById('txtScriptResult');target.innerHTML='';target.appendChild(box);}

async function uploadTxtScriptFiles(files){var list=Array.prototype.slice.call(files||[]);if(!list.length)return;var p=document.getElementById('txtScriptProgress');p.style.display='';p.textContent='导入中&hellip;';var fd=new FormData();list.forEach(function(file){fd.append('files',file);});fd.append('category',document.getElementById('scriptCategory').value);fd.append('video_type','');fd.append('tags','本地txt');fd.append('product_name','');try{var r=await fetch('/api/templates/viral/upload-txt-batch',{method:'POST',body:fd});var d=await r.json();if(r.ok){var data=d.data||{};var msg='总计 '+(data.total||list.length)+'，成功 '+(data.success||0)+'，跳过 '+(data.skipped||0);if(data.errors&&data.errors.length)msg+='，错误 '+data.errors.length;toast(d.message||'导入成功','success');showScriptImportResult(msg,'success');document.getElementById('txtScriptFiles').value='';}else{toast('失败','error');showScriptImportResult((d.detail||'导入失败'),'error');}}catch(e){toast('失败','error');showScriptImportResult('导入失败：'+e.message,'error');}p.style.display='none';}

async function readJsonResponse(response){var text=await response.text();var contentType=(response.headers.get('content-type')||'').toLowerCase();if(contentType.indexOf('application/json')>=0){return JSON.parse(text||'{}');}var cleaned=(text||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();throw new Error(response.ok?'服务返回了页面内容，请稍后重试':'HTTP '+response.status+'：'+(cleaned||'服务暂时不可用').substring(0,90));}
function renderLocalTxtScanState(d,type){d=d||{};var running=!!d.is_running;var summary='总计 '+(d.total||0)+'，已处理 '+(d.processed||0)+'，新增 '+(d.success||0)+'，跳过 '+(d.skipped||0)+'，错误 '+(d.error_count||0);var html='<div class="result-card'+(type==='error'||(d.error_count||0)>0?' error':'')+'"><strong>'+escHtml(summary)+'</strong>';if(d.message)html+='<div style="margin-top:6px;color:inherit">'+escHtml(d.message)+'</div>';html+=renderResultList('errors','错误明细',d.errors||[]);html+='</div>';document.getElementById('txtScriptResult').innerHTML=html;var btn=document.getElementById('btnScanLocalTxtScripts');if(btn){btn.disabled=running;btn.innerHTML=(running?'<i data-lucide="loader"></i>扫描中':'<i data-lucide="folder-search"></i>扫码本地脚本');if(window.lucide)lucide.createIcons();}var p=document.getElementById('txtScriptProgress');p.style.display=running?'':'none';p.textContent=running?'扫描中，正在逐条分析新增脚本...':'';}
async function pollLocalTxtScanStatus(){try{var r=await fetch('/api/templates/viral/scan-local-txt/status',{headers:{'Accept':'application/json'}});var d=await readJsonResponse(r);localTxtScanFailures=0;var data=d.data||{};renderLocalTxtScanState(data,(data.error_count||0)>0?'error':'success');if(!data.is_running&&localTxtScanTimer){clearInterval(localTxtScanTimer);localTxtScanTimer=null;toast('本地脚本扫描完成','success');}}catch(e){localTxtScanFailures+=1;showScriptImportResult('服务连接不稳定，稍后自动重试（'+localTxtScanFailures+'/5）：'+e.message,'error');if(localTxtScanFailures<5)return;if(localTxtScanTimer){clearInterval(localTxtScanTimer);localTxtScanTimer=null;}var btn=document.getElementById('btnScanLocalTxtScripts');if(btn)btn.disabled=false;document.getElementById('txtScriptProgress').style.display='none';}}
async function scanLocalTxtScripts(){var btn=document.getElementById('btnScanLocalTxtScripts');if(btn)btn.disabled=true;var p=document.getElementById('txtScriptProgress');p.style.display='';p.textContent='扫描启动中...';localTxtScanFailures=0;var fd=new FormData();fd.append('category',document.getElementById('scriptCategory').value);fd.append('video_type','');fd.append('tags','本地txt');fd.append('product_name','');try{var r=await fetch('/api/templates/viral/scan-local-txt',{method:'POST',headers:{'Accept':'application/json'},body:fd});var d=await readJsonResponse(r);if(r.ok){renderLocalTxtScanState(d.data||{},'success');toast(d.message||'扫描已启动','success');if(localTxtScanTimer)clearInterval(localTxtScanTimer);localTxtScanTimer=setInterval(pollLocalTxtScanStatus,2000);pollLocalTxtScanStatus();}else{if(btn)btn.disabled=false;p.style.display='none';showScriptImportResult((d.detail||'扫描启动失败'),'error');toast('失败','error');}}catch(e){if(btn)btn.disabled=false;p.style.display='none';showScriptImportResult('扫描启动失败：'+e.message,'error');toast('失败','error');}}

async function importScript(){var c=document.getElementById('scriptContent').value.trim();if(!c)return toast('请粘贴脚本','error');var fd=new FormData();fd.append('content',c);fd.append('title',document.getElementById('scriptTitle').value.trim()||'导入脚本');fd.append('category',document.getElementById('scriptCategory').value);fd.append('video_type','');fd.append('tags','');fd.append('product_name','');try{var r=await fetch('/api/templates/viral/upload',{method:'POST',body:fd});var d=await r.json();if(r.ok){toast(d.message,'success');document.getElementById('scriptResult').innerHTML='<div style="padding:12px 16px;background:var(--facai-soft);border-radius:var(--r);font-size:13px;color:var(--accent)">'+d.message+'</div>';document.getElementById('scriptContent').value='';}else toast('失败','error');}catch(e){toast('失败','error');}}
document.addEventListener('DOMContentLoaded',function(){if(window.lucide)lucide.createIcons();});
</script>
</body>
</html>
