<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数据导入 — 法采新媒体运营 Agent</title>
<link rel="stylesheet" href="/static/css/style.css?v=mobile-20260612">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
@media (max-width: 768px) {
  main.page-main > div { grid-template-columns: 1fr !important; gap: 14px !important; }
  main.page-main > div .card:nth-child(2) > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  main.page-main > div .btn { width: 100%; }
}
</style>
</head>
<body>

<nav class="nav">
<div class="nav-inner">
<a href="/app" class="nav-brand"><span class="nav-brand-mark"><img src="/static/images/facai-logo.png" alt="法采"></span><span>法采新媒体运营 Agent</span></a>
<div class="nav-links">
<a href="/app" class="nav-link">生成</a><a href="/app/rewrite" class="nav-link">改写</a><a href="/app/products" class="nav-link">产品</a><a href="/app/import" class="nav-link on">导入</a><a href="/app/templates" class="nav-link">模板库</a><a href="/app/history" class="nav-link">历史</a>
<a href="/app/search" class="nav-link">检索</a>
</div></div></nav>

<main class="page-main">
<header class="page-hd"><h1>数据导入</h1><p>CSV/Excel 批量导入产品数据，或直接粘贴脚本</p></header>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px">

<!-- CSV/Excel -->
<div class="card">
<h2 style="margin-bottom:16px">批量导入产品 (CSV/Excel)</h2>
<div id="productDrop" class="drop" style="margin-bottom:14px">
<i data-lucide="file-up" style="width:40px;height:40px;margin-bottom:10px;color:var(--text-3)"></i>
<p style="font-weight:600;color:var(--text-2);font-family:var(--font-ui)">拖拽文件或点击选择</p>
<p style="font-size:13px;color:var(--text-3);margin-top:6px">支持 .csv / .xlsx 格式，包含 name/category/price 等列</p>
<input type="file" id="productFile" style="position:absolute;width:1px;height:1px;opacity:0" accept=".csv,.xlsx,.xls">
</div>
<div id="productProgress" style="text-align:center;font-size:13px;color:var(--facai);display:none;margin-bottom:12px"></div>
<div id="productResult"></div>
</div>

<!-- 脚本导入 -->
<div class="card">
<h2 style="margin-bottom:16px">脚本导入</h2>
<div style="margin-bottom:12px">
<label style="display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px">脚本内容</label>
<textarea id="scriptContent" class="so-input" rows="8" placeholder="粘贴脚本内容（支持带时间戳格式，自动清洗为段落）&#10;&#10;示例：&#10;【开场钩子-0-3s】才X毛多一套！&#10;【痛点-3-10s】刀软切不动...&#10;&#10;保存后自动变为：&#10;才X毛多一套！刀软切不动..."></textarea>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
<div><label style="display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px">标题</label><input id="scriptTitle" class="input" style="font-size:13px" placeholder="选填"></div>
<div><label style="display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px">品类</label><select id="scriptCategory" class="input" style="font-size:13px"><option>烘焙调色</option><option>烘焙装饰</option><option>烘焙调味</option><option>烘焙夹心</option><option selected>烘焙配件</option></select></div>
</div>
<button class="btn btn-pri" onclick="importScript()">导入脚本</button>
<p style="font-size:12px;color:var(--text-3);margin-top:8px">带时间戳、镜头指令的脚本会自动格式化为干净段落保存</p>
<div id="scriptResult" style="margin-top:12px"></div>
</div>

</div>
</main>

<script>
function toast(msg,type){var e=document.createElement('div');e.className='toast toast-'+(type==='success'?'ok':'err');e.textContent=(type==='success'?'OK ':'!! ')+msg;document.body.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(function(){e.remove()},300)},2000);}

var dz=document.getElementById('productDrop');dz.addEventListener('click',function(){document.getElementById('productFile').click();});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.style.borderColor='var(--facai)';dz.style.background='var(--facai-ghost)';});
dz.addEventListener('dragleave',function(){dz.style.borderColor='var(--border)';dz.style.background='';});
dz.addEventListener('drop',function(e){e.preventDefault();dz.style.borderColor='var(--border)';dz.style.background='';if(e.dataTransfer.files.length>0)uploadProductFile(e.dataTransfer.files[0]);});
document.getElementById('productFile').addEventListener('change',function(e){if(e.target.files.length>0)uploadProductFile(e.target.files[0]);});

async function uploadProductFile(file){var p=document.getElementById('productProgress');p.style.display='';p.textContent='导入中&hellip;';var fd=new FormData();fd.append('file',file);var name=file.name.toLowerCase();var url=(name.endsWith('.xlsx')||name.endsWith('.xls'))?'/api/import/excel':'/api/import/csv';try{var r=await fetch(url,{method:'POST',body:fd});var d=await r.json();if(r.ok){toast('导入成功','success');var msg='总计 '+(d.total||0)+'，成功 '+(d.success||0)+'，跳过 '+(d.skipped||0);if(d.errors&&d.errors.length)msg+='，错误 '+d.errors.length;document.getElementById('productResult').innerHTML='<div style="padding:12px 16px;background:var(--facai-soft);border-radius:var(--r);font-size:13px;color:var(--facai)">'+msg+'</div>';}else toast('失败','error');}catch(e){toast('失败','error');}p.style.display='none';}

async function importScript(){var c=document.getElementById('scriptContent').value.trim();if(!c)return toast('请粘贴脚本','error');var fd=new FormData();fd.append('content',c);fd.append('title',document.getElementById('scriptTitle').value.trim()||'导入脚本');fd.append('category',document.getElementById('scriptCategory').value);fd.append('video_type','');fd.append('tags','');fd.append('product_name','');try{var r=await fetch('/api/templates/viral/upload',{method:'POST',body:fd});var d=await r.json();if(r.ok){toast(d.message,'success');document.getElementById('scriptResult').innerHTML='<div style="padding:12px 16px;background:var(--facai-soft);border-radius:var(--r);font-size:13px;color:var(--accent)">'+d.message+'</div>';document.getElementById('scriptContent').value='';}else toast('失败','error');}catch(e){toast('失败','error');}}
document.addEventListener('DOMContentLoaded',function(){if(window.lucide)lucide.createIcons();});
</script>
</body>
</html>
