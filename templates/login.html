<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 法采新媒体运营 Agent</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:var(--bg,#f5f7fa);padding:24px}
    .login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line,#e5e7eb);border-radius:18px;padding:32px;box-shadow:0 18px 55px rgba(20,30,50,.09)}
    .login-card h1{font-size:24px;margin:0 0 8px}.login-card p{color:var(--muted,#667085);line-height:1.65;margin:0 0 24px}
    .login-card label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
    .login-card input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line,#d0d5dd);border-radius:10px;font:inherit}
    .login-card button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--primary,#d75b35);color:#fff;font:inherit;font-weight:700;cursor:pointer}
    .login-card button:disabled{opacity:.65;cursor:wait}.error{min-height:22px;margin-top:12px;color:#b42318;font-size:13px}
  </style>
</head>
<body>
  <main class="login-card">
    <h1>访问验证</h1>
    <p>请输入管理员提供的访问口令。权限由口令对应的 admin、operator 或 viewer 角色决定。</p>
    <form id="loginForm">
      <label for="token">访问口令</label>
      <input id="token" name="token" type="password" required autocomplete="current-password" maxlength="500" autofocus>
      <button id="submitButton" type="submit">登录</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
  document.getElementById('loginForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    const button=document.getElementById('submitButton');
    const error=document.getElementById('error');
    button.disabled=true; error.textContent='';
    try {
      const response=await fetch('/api/auth/login',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:document.getElementById('token').value})
      });
      const data=await response.json().catch(function(){return {};});
      if(!response.ok) throw new Error(data.detail||'登录失败');
      const requested=new URLSearchParams(location.search).get('next')||'/app';
      location.href=requested.startsWith('/app')?requested:'/app';
    } catch (loginError) {
      error.textContent=loginError.message||'登录失败';
      button.disabled=false;
    }
  });
  </script>
</body>
</html>
