<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 - 法采新媒体运营 Agent</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);padding:24px}
.login-panel{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
.login-title{font-family:var(--font-display);font-size:1.35rem;margin:0 0 6px;color:var(--text)}
.login-subtitle{font-family:var(--font-ui);font-size:13px;color:var(--text-3);margin:0 0 20px}
.login-label{display:block;font-family:var(--font-ui);font-size:12px;font-weight:800;color:var(--text-2);margin-bottom:8px}
.login-input{width:100%;height:42px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);padding:0 12px;font-family:var(--font-ui);font-size:14px;color:var(--text);box-sizing:border-box}
.login-button{width:100%;height:42px;margin-top:14px;border:0;border-radius:var(--r-sm);background:var(--facai);color:#fff;font-family:var(--font-ui);font-size:14px;font-weight:900;cursor:pointer}
.login-error{min-height:18px;margin-top:12px;font-family:var(--font-ui);font-size:12px;color:#b42318}
</style>
</head>
<body>
<main class="login-panel">
  <h1 class="login-title">管理员登录</h1>
  <p class="login-subtitle">法采新媒体运营 Agent</p>
  <form id="loginForm">
    <label class="login-label" for="tokenInput">管理员口令</label>
    <input class="login-input" id="tokenInput" name="token" type="password" autocomplete="current-password" autofocus>
    <button class="login-button" type="submit">进入</button>
    <div class="login-error" id="loginError"></div>
  </form>
</main>
<script>
const params=new URLSearchParams(window.location.search);
const next=params.get('next')||'/app';
document.getElementById('loginForm').addEventListener('submit',async function(event){
  event.preventDefault();
  const error=document.getElementById('loginError');
  error.textContent='';
  const token=document.getElementById('tokenInput').value.trim();
  try{
    const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    if(!response.ok){
      const data=await response.json().catch(function(){return{};});
      error.textContent=data.detail||'登录失败';
      return;
    }
    window.location.href=next.startsWith('/')?next:'/app';
  }catch(e){
    error.textContent='网络错误';
  }
});
</script>
</body>
</html>
