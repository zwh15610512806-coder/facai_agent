<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI工作 · 法采新媒体运营 Agent</title>
<link rel="stylesheet" href="/static/css/style.css?v=nav-20260710-hardening">
<script src="/static/vendor/lucide.min.js"></script>
<script src="/static/js/common.js?v=tools-20260713"></script>
<link rel="stylesheet" href="/static/css/inspiration.css?v=20260710-stream">
</head>
<body>
<nav class="nav">
<div class="nav-inner">
<div class="nav-brand-group">
<a href="/app" class="nav-brand"><span class="nav-brand-mark"><img src="/static/images/facai-logo.png" alt="法采"></span><span>法采新媒体运营 Agent</span></a>
</div>
<div class="nav-links">
<a href="/app" class="nav-link on">AI工作</a><a href="/app/generate" class="nav-link">生成脚本</a><a href="/app/rewrite" class="nav-link">脚本改写</a><a href="/app/products" class="nav-link">产品知识库</a><a href="/app/creators" class="nav-link">达人工作</a><a href="/app/operations" class="nav-link">运营数据中台</a><a href="/app/templates" class="nav-link">脚本模板库</a><a href="/app/history" class="nav-link">生成历史</a><a href="/app/search" class="nav-link">检索</a>
</div></div></nav>
<main class="inspiration-page">
<section class="inspiration-shell" aria-label="AI工作对话工作台">
  <aside class="inspiration-panel inspiration-side">
    <button class="btn btn-pri inspiration-new" type="button" onclick="startNewConversation()"><i data-lucide="plus"></i>新对话</button>
    <div class="conversation-section">
      <div class="inspiration-side-title">历史对话</div>
      <div id="conversationHistoryList" class="conversation-list" aria-label="历史对话列表"></div>
      <div id="conversationArchiveSection" class="conversation-archive-section">
        <button id="conversationArchiveToggle" class="conversation-archive-toggle" type="button" onclick="toggleArchiveSection()" aria-expanded="false">
          <span>已归档 <span id="archivedConversationCount">0</span></span>
          <i data-lucide="chevron-down"></i>
        </button>
        <div id="archivedConversationList" class="conversation-list conversation-archive-list" aria-label="已归档对话列表" hidden></div>
      </div>
    </div>
    <div class="inspiration-note">对话会保存在当前浏览器，适合沉淀脚本方向、标题、口播和活动表达。</div>
  </aside>
  <button id="historyDrawerBackdrop" class="history-drawer-backdrop" type="button" onclick="setHistoryDrawer(false)" aria-label="关闭历史对话"></button>
  <section class="inspiration-panel inspiration-main">
    <div class="inspiration-hd">
      <div><h1 class="inspiration-title">AI工作</h1><div class="text-2" style="font-size:13px">和 AI 聊创意、脚本、选题与运营表达</div></div>
      <button id="historyDrawerToggle" class="icon-button history-drawer-toggle" type="button" onclick="toggleHistoryDrawer()" aria-controls="conversationHistoryList" aria-expanded="false" aria-label="打开历史对话"><i data-lucide="panel-left"></i></button>
      <span id="modelPill" class="model-pill"><i data-lucide="sparkles"></i><span>AI 对话</span></span>
    </div>
    <div id="inspirationThread" class="inspiration-thread"></div>
    <div class="inspiration-composer">
      <div class="composer-tools" aria-label="AI工作对话功能">
        <button id="productContextToggle" class="tool-button" type="button" aria-pressed="false" onclick="toggleProductContextMode()"><i data-lucide="package-search"></i>基于产品资料</button>
        <button class="tool-button" type="button" onclick="document.getElementById('inspirationFileInput').click()"><i data-lucide="paperclip"></i>上传文件</button>
        <button class="tool-button mode-button" type="button" data-tool-mode="thinking" onclick="setInspirationMode('thinking')"><i data-lucide="brain-circuit"></i>思考模式</button>
        <button class="tool-button mode-button" type="button" data-tool-mode="seedance" onclick="setInspirationMode('seedance')"><i data-lucide="clapperboard"></i>分镜提示词生成</button>
        <button class="tool-button mode-button" type="button" data-tool-mode="research" onclick="setInspirationMode('research')"><i data-lucide="search"></i>深入研究</button>
        <button id="webSearchToggle" class="tool-button" type="button" aria-pressed="false" onclick="toggleWebSearchMode()"><i data-lucide="globe-2"></i>联网搜索</button>
        <input id="inspirationFileInput" type="file" accept=".txt,.md,.json,.csv,.pdf,.docx,.xlsx,.jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple hidden>
      </div>
      <div id="attachmentList" class="attachment-list" aria-live="polite"></div>
      <form class="composer-form" onsubmit="sendInspirationChat(event)">
        <button id="clearChatBtn" class="icon-button" type="button" onclick="clearCurrentConversation()" aria-label="清空当前对话" title="清空当前对话"><i data-lucide="trash-2"></i></button>
        <textarea id="inspirationInput" class="inspiration-input" rows="1" placeholder="问点什么，例如：帮我想一个奶冻粉的短视频脚本方向..." onkeydown="submitOnEnter(event)"></textarea>
        <button id="inspirationCancelBtn" class="icon-button cancel-button" type="button" onclick="cancelInspirationChat()" aria-label="取消生成" title="取消生成" hidden><i data-lucide="square"></i></button>
        <button id="inspirationSend" class="icon-button send-button" type="submit" aria-label="发送"><i data-lucide="send-horizontal"></i></button>
      </form>
    </div>
  </section>
</section>
</main>
<div id="conversationFloatingMenu" class="conversation-action-menu conversation-floating-menu" role="menu" hidden></div>
<script src="/static/js/inspiration.js?v=20260710-stream"></script>
</body>
</html>
