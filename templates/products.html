<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>产品信息 — 法采新媒体运营 Agent</title>
<link rel="stylesheet" href="/static/css/style.css?v=mobile-20260612">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
.spt{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:500;margin:1px}
.spt-功效{background:#ecf5cc;color:#4a5a1c}.spt-性价比{background:var(--facai-soft);color:var(--facai)}.spt-场景{background:#dce6f5;color:#334a7a}.spt-痛点{background:#f5dedb;color:#9a3030}.spt-对比{background:#e0ddf0;color:#404078}
.product-card-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto;width:100%}
.product-card-action{height:30px;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 7px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);font-family:var(--font-ui);font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease),background var(--fast) var(--ease),box-shadow var(--fast) var(--ease);line-height:1}
.product-card-action svg,.product-card-action i{width:10px;height:10px;stroke-width:2;flex:0 0 auto}
.product-card-action:hover{border-color:var(--facai);color:var(--facai);background:var(--facai-ghost);box-shadow:inset 0 -1px 0 rgba(122,139,60,.08)}
.product-card-action.danger:hover{border-color:rgba(220,38,38,.35);color:var(--danger);background:var(--danger-soft)}
.product-card-action.is-disabled{color:var(--text-3);background:var(--surface-darker);border-color:var(--border-soft);cursor:not-allowed;pointer-events:none;box-shadow:none}
.section-hd-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
#productDetailModal{align-items:flex-start;padding:84px 28px 24px}
.detail-box{max-width:min(1280px,calc(100vw - 56px));width:min(1280px,calc(100vw - 56px));height:calc(100dvh - 108px);max-height:calc(100dvh - 108px);display:flex;flex-direction:column;overflow:hidden}
.detail-box .mo-hd{flex:0 0 auto;padding:22px 32px}
.detail-box .mo-body{flex:1;min-height:0;overflow:hidden;padding:28px 32px 32px}
.detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.detail-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r-pill);background:var(--facai-soft);color:var(--facai);font-size:12px;font-weight:600}
.detail-grid{display:grid;grid-template-columns:minmax(340px,.8fr) minmax(720px,1.2fr);gap:24px;align-items:stretch;height:100%;min-height:0}
.detail-grid>section{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.detail-section-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}
.detail-point-list{display:grid;gap:10px;overflow:auto;padding-right:4px}
.detail-point{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;background:var(--surface-darker)}
.detail-point-type{display:inline-block;margin-bottom:5px;font-size:11px;font-weight:700;color:var(--facai)}
.detail-point-text{font-size:13px;line-height:1.7;color:var(--text)}
#detailSkuPrices{display:flex;min-height:0;overflow:hidden}
.detail-sku-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:auto;background:var(--surface);max-height:100%;flex:1}
.detail-sku-table{width:100%;min-width:720px;border-collapse:collapse;font-size:12px}
.detail-sku-table th,.detail-sku-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);text-align:left;vertical-align:top}
.detail-sku-table th{background:var(--surface-darker);color:var(--text-2);font-weight:700;position:sticky;top:0;z-index:1}
.detail-sku-table tr:last-child td{border-bottom:0}
.detail-activity-lines{display:grid;gap:5px;min-width:230px}
.detail-activity-item{font-size:11px;line-height:1.45;color:var(--text-2)}
.detail-activity-name{display:inline-block;font-weight:700;color:var(--facai);margin-right:4px}
.detail-activity-price{font-weight:700;color:var(--text)}
.detail-activity-meta{display:block;color:var(--text-3);margin-top:1px}
.detail-empty{padding:18px;border:1px dashed var(--border);border-radius:var(--r);color:var(--text-3);font-size:13px;text-align:center}
.detail-loading{padding:42px 0;text-align:center;color:var(--text-3);font-size:13px}
@media (max-width: 768px) {
  .section-hd-between { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 18px; }
  .section-hd-between > div:last-child { display: grid !important; grid-template-columns: 1fr; gap: 8px; }
  .card-sm > div { flex-direction: column; align-items: stretch; gap: 10px !important; }
  .card-sm > div > div { width: 100%; margin-right: 0 !important; }
  .card-sm .fpill { flex: 1 1 auto; }
  #searchInput, #categoryFilter { max-width: 100% !important; }
  .product-card-actions { gap: 6px; }
  .product-card-action { height: 30px; padding: 0 5px; font-size: 11px; }
  .mo-body > div:last-child { flex-wrap: wrap; justify-content: stretch !important; }
  .mo-body > div:last-child .btn { flex: 1 1 auto; }
  #productDetailModal { align-items: flex-end; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .detail-box { width: 100%; max-width: 100%; height: calc(100dvh - 24px - env(safe-area-inset-bottom)); max-height: calc(100dvh - 24px - env(safe-area-inset-bottom)); }
  .detail-box .mo-hd { padding: 16px; }
  .detail-box .mo-body { padding: 16px; }
  .detail-grid { grid-template-columns: 1fr; gap: 16px; overflow:auto; align-items:start; }
  .detail-grid>section { overflow:visible; }
  .detail-point-list { overflow:visible; padding-right:0; }
  #detailSkuPrices { overflow:visible; }
  .detail-sku-wrap { max-height:none; overflow:auto; }
}
</style>
</head>
<body>

<nav class="nav">
<div class="nav-inner">
<a href="/app" class="nav-brand"><span class="nav-brand-mark"><img src="/static/images/facai-logo.png" alt="法采"></span><span>法采新媒体运营 Agent</span></a>
<div class="nav-links">
<a href="/app" class="nav-link">生成</a><a href="/app/rewrite" class="nav-link">改写</a><a href="/app/products" class="nav-link on">产品</a><a href="/app/import" class="nav-link">导入</a><a href="/app/templates" class="nav-link">模板库</a><a href="/app/history" class="nav-link">历史</a>
<a href="/app/search" class="nav-link">检索</a>
</div></div></nav>

<main class="page-main">
<header class="page-hd">
<div class="section-hd-between">
<div><h1>产品信息</h1><p style="margin-top:2px"><span id="productCount">0</span> 个法采产品</p></div>
<div style="display:flex;gap:8px">
<button class="btn btn-soft btn-sm" onclick="extractAllPoints()">批量整理卖点</button>
<a href="/app/import" class="btn btn-soft btn-sm">批量导入</a>
</div></div>
</header>

<div class="card card-sm" style="margin-bottom:18px">
<div style="display:flex;flex-wrap:wrap;gap:12px">
<div style="display:flex;gap:4px;margin-right:8px">
<button id="searchModeKw" class="fpill on" onclick="setSearchMode('keyword')">关键词</button>
<button id="searchModeSem" class="fpill" onclick="setSearchMode('semantic')">语义搜索</button>
</div>
<input id="searchInput" type="text" placeholder="搜索产品&hellip;" class="input" style="max-width:220px;font-size:13px" oninput="debounceLoad()">
<select id="categoryFilter" class="input" style="max-width:160px;font-size:13px" onchange="loadProducts()"><option value="">全部品类</option></select>
</div></div>

<div id="productGrid" class="product-grid"><div style="grid-column:1/-1;text-align:center;padding:48px 0;color:var(--text-3)">加载中&hellip;</div></div>
</main>

<!-- 产品详情弹窗 -->
<div id="productDetailModal" class="mo" style="display:none" onclick="if(event.target===this)closeProductDetail()">
<div class="mo-box detail-box" role="dialog" aria-modal="true" aria-labelledby="detailProductName">
<div class="mo-hd">
<div>
<h3 id="detailProductName" style="margin:0;font-family:var(--font-serif);font-size:1.18rem"></h3>
<div class="detail-meta">
<span id="detailCategory" class="detail-pill"></span>
<span id="detailSource" class="detail-pill"></span>
</div>
</div>
<button onclick="closeProductDetail()" style="background:none;border:none;font-size:22px;color:var(--text-3);cursor:pointer">&times;</button>
</div>
<div class="mo-body">
<div id="detailLoading" class="detail-loading">加载产品详情&hellip;</div>
<div id="detailContent" class="detail-grid" style="display:none">
<section>
<div class="detail-section-title">产品卖点</div>
<div id="detailSellingPoints" class="detail-point-list"></div>
</section>
<section>
<div class="detail-section-title">各 SKU 售价</div>
<div id="detailSkuPrices"></div>
</section>
</div>
</div>
</div>
</div>

<!-- 文件上传弹窗 -->
<div id="uploadModal" class="mo" style="display:none" onclick="if(event.target===this)closeUploadModal()">
<div class="mo-box">
<div class="mo-hd"><h3 style="margin:0;font-family:var(--font-serif);font-size:1.1rem">产品资料</h3><button onclick="closeUploadModal()" style="background:none;border:none;font-size:22px;color:var(--text-3);cursor:pointer">&times;</button></div>
<div class="mo-body">
<p style="font-size:13px;margin-bottom:4px">产品：<b id="uploadProductName"></b></p>
<p style="font-size:12px;color:var(--text-3);margin-bottom:14px" id="uploadFileStatus"></p>
<div id="dropZone" class="drop" style="margin-bottom:14px">
<div style="font-size:36px;margin-bottom:8px">&#128193;</div>
<p style="font-weight:500;color:var(--text-2)">拖拽文件或点击选择</p>
<p style="font-size:12px;color:var(--text-3);margin-top:4px">PDF/Word/Excel/图片/文本</p>
<input type="file" id="fileInput" style="position:absolute;width:1px;height:1px;opacity:0" accept=".pdf,.doc,.docx,.xlsx,.xls,.jpg,.jpeg,.png,.txt,.csv">
</div>
<div id="uploadProgress" style="text-align:center;font-size:13px;color:var(--facai);display:none;margin-bottom:12px"></div>
<div style="display:flex;justify-content:flex-end;gap:8px">
<button onclick="deleteFile()" id="btnDeleteFile" class="btn btn-danger btn-sm" style="display:none">删除文件</button>
<button onclick="extractPoints()" id="btnExtractPoints" class="btn btn-soft btn-sm" style="display:none">从资料整理卖点</button>
<button onclick="closeUploadModal()" class="btn btn-soft btn-sm">取消</button>
<button onclick="uploadFile()" id="btnUpload" class="btn btn-pri btn-sm" disabled>上传</button>
</div></div></div></div>

<script>
let products=[],categories=[],uploadProductId=null,selectedFile=null,searchMode='keyword';

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jsq(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}
function formatPrice(v){const n=Number(v);return Number.isFinite(n)?(Math.round(n*100)/100).toString():'';}
function hasPending(p,field){return Array.isArray(p&&p.pending_fields)&&p.pending_fields.indexOf(field)>=0;}
function displayCategory(p){return hasPending(p,'category')?'待更新':(p&&p.category?p.category:'待更新');}
function displayPrice(p){return hasPending(p,'price')?'待更新':'¥'+formatPrice(p&&p.price);}

function setSearchMode(mode){
 searchMode=mode;
 document.getElementById('searchModeKw').classList.toggle('on',mode==='keyword');
 document.getElementById('searchModeSem').classList.toggle('on',mode==='semantic');
 document.getElementById('searchInput').placeholder=mode==='semantic'?'描述你需要的产品&hellip;':'搜索产品&hellip;';
 loadProducts();
}

function toast(msg,type){const t=document.createElement('div');t.className='toast toast-'+(type==='success'?'ok':'err');t.textContent=(type==='success'?'OK ':'!! ')+msg;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){t.remove()},300)},2000);}

let _dt;function debounceLoad(){clearTimeout(_dt);_dt=setTimeout(loadProducts,300);}

async function loadProducts(){
 const s=document.getElementById('searchInput').value,c=document.getElementById('categoryFilter').value;
 let u;if(searchMode==='semantic'&&s){u='/api/products/search/semantic?q='+encodeURIComponent(s)+'&limit=30';if(c)u+='&category='+encodeURIComponent(c);}
 else{u='/api/products/?';if(c)u+='category='+encodeURIComponent(c)+'&';if(s)u+='search='+encodeURIComponent(s)+'&';}
 const r=await fetch(u);products=await r.json();
 document.getElementById('productCount').textContent=products.length;
 renderGrid();
}
async function loadCategories(){const r=await fetch('/api/products/categories');categories=await r.json();const sel=document.getElementById('categoryFilter');categories.forEach(function(c){const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});}

function renderGrid(){
 const g=document.getElementById('productGrid');
 if(!products.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--text-3)">暂无产品 &middot; <a href="/app/import" class="text-accent">去导入</a></div>';return;}
 g.innerHTML=products.map(function(p){
 let spHtml='<span style="font-size:12px;color:var(--text-3)">暂无卖点</span>';
  if(p.selling_point_summary){spHtml=p.selling_point_summary.split('；').slice(0,2).map(function(s){const m=s.match(/^\[(.+?)\](.+)/);return m?'<span class="spt spt-'+esc(m[1])+'">'+esc(m[2].substring(0,18))+'</span>':'';}).join(' ');}
  const pname=esc(p.name),pcat=esc(displayCategory(p)),pprice=esc(displayPrice(p)),pnameArg=jsq(p.name);
  return '<div class="product-card" role="button" tabindex="0" onclick="openProductDetail('+p.id+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openProductDetail('+p.id+')}">'
   +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><span class="pcat">'+pcat+'</span><span style="font-size:12px;color:var(--text-3)">'+p.selling_point_count+'卖点</span></div>'
   +'<div class="pname" style="margin:0">'+pname+'</div>'
   +'<div style="display:flex;align-items:baseline;gap:8px;margin:8px 0"><span class="pprice">'+pprice+'</span>'+(!hasPending(p,'price')&&p.original_price?'<span style="font-size:12px;color:var(--text-3);text-decoration:line-through">&yen;'+formatPrice(p.original_price)+'</span>':'')+'</div>'
   +'<div style="display:flex;gap:2px;flex-wrap:wrap;margin-bottom:10px;flex:1">'+spHtml+'</div>'
   +'<div class="product-card-actions">'
   +'<button type="button" class="product-card-action" onclick="event.stopPropagation();openUploadModal('+p.id+',\''+pnameArg+'\')" title="管理产品资料"><i data-lucide="file-up"></i><span>资料</span></button>'
   +(p.info_file?'<a href="/api/products/'+p.id+'/download" class="product-card-action" title="下载产品资料" onclick="event.stopPropagation()"><i data-lucide="download"></i><span>下载</span></a>':'<span class="product-card-action is-disabled" title="暂无产品资料" onclick="event.stopPropagation()"><i data-lucide="download"></i><span>下载</span></span>')
   +'<button type="button" class="product-card-action danger" onclick="event.stopPropagation();deleteProduct('+p.id+')" title="删除产品"><i data-lucide="trash-2"></i><span>删除</span></button>'
   +'</div></div>';
 }).join('');
 if(window.lucide)lucide.createIcons();
}

async function openProductDetail(id){
 document.getElementById('productDetailModal').style.display='';
 document.getElementById('detailLoading').innerHTML='加载产品详情&hellip;';
 document.getElementById('detailLoading').style.display='';
 document.getElementById('detailContent').style.display='none';
 document.getElementById('detailProductName').textContent='产品详情';
 document.getElementById('detailCategory').textContent='加载中';
 document.getElementById('detailSource').textContent='资料手册';
 try{
  const r=await fetch('/api/products/'+id+'/detail');
  if(!r.ok)throw new Error('detail failed');
  const d=await r.json();
  document.getElementById('detailProductName').textContent=d.name||'产品详情';
  document.getElementById('detailCategory').textContent=hasPending(d,'category')?'待更新':(d.category||'未分类');
  const sourceText=(d.knowledge_sources&&d.knowledge_sources.length)?d.knowledge_sources.join('、'):(d.manual_source||'产品手册');
  document.getElementById('detailSource').textContent='卖点来源：'+sourceText;
  document.getElementById('detailSellingPoints').innerHTML=renderProductSellingPoints(d.selling_points||[]);
  document.getElementById('detailSkuPrices').innerHTML=renderProductSkuRows(d.sku_prices||[]);
  document.getElementById('detailLoading').style.display='none';
  document.getElementById('detailContent').style.display='';
 }catch(e){
  document.getElementById('detailLoading').innerHTML='<div class="detail-empty">产品详情加载失败，请稍后重试</div>';
 }
}

function closeProductDetail(){document.getElementById('productDetailModal').style.display='none';}

function renderProductSellingPoints(points){
 if(!points.length)return '<div class="detail-empty">暂无卖点</div>';
 return points.map(function(point){
  return '<article class="detail-point">'
   +'<span class="detail-point-type">'+esc(point.point_type||'卖点')+'</span>'
   +'<div class="detail-point-text">'+esc(point.content||'')+'</div>'
   +'</article>';
 }).join('');
}

function renderProductSkuRows(skus){
 if(!skus.length)return '<div class="detail-empty">暂无 SKU 售价</div>';
 return '<div class="detail-sku-wrap"><table class="detail-sku-table">'
  +'<thead><tr><th>SKU</th><th>售价</th><th>日常价</th><th>活动机制价</th></tr></thead>'
  +'<tbody>'+skus.map(function(sku){
    const skuName=[sku.product,sku.spec].filter(Boolean).join(' · ');
    return '<tr><td>'+esc(skuName||'默认规格')+'</td><td style="font-weight:700;color:var(--facai)">¥'+formatPrice(sku.price)+'</td><td>'+(sku.daily_price?'¥'+formatPrice(sku.daily_price):'-')+'</td>'+renderActivityPriceCells(sku.activity_prices||[])+'</tr>';
  }).join('')+'</tbody></table></div>';
}

function renderActivityPriceCells(activities){
 if(!activities.length)return '<td>-</td>';
 return '<td><div class="detail-activity-lines">'+activities.map(function(activity){
  const mechanism=shortMechanismName(activity.mechanism||'活动');
  const price=activity.final_price||activity.activity_price||activity.tag_price;
  const meta=[];
  if(activity.activity_price&&formatPrice(activity.activity_price)!==formatPrice(price))meta.push('活动价 ¥'+formatPrice(activity.activity_price));
  else if(activity.activity_price&&mechanism!=='日常')meta.push('活动价 ¥'+formatPrice(activity.activity_price));
  if(activity.unit_price&&formatPrice(activity.unit_price)!==formatPrice(price))meta.push('瓶均 ¥'+formatPrice(activity.unit_price));
  if(activity.discount)meta.push(activity.discount);
  if(activity.coupon&&activity.coupon!=='0')meta.push('券 '+activity.coupon);
  if(activity.single_activity)meta.push(activity.single_activity);
  return '<div class="detail-activity-item"><span class="detail-activity-name">'+esc(mechanism)+'</span><span class="detail-activity-price">¥'+formatPrice(price)+'</span>'+(meta.length?'<span class="detail-activity-meta">'+esc(meta.join(' / '))+'</span>':'')+'</div>';
 }).join('')+'</div></td>';
}

function shortMechanismName(name){
 if(name.indexOf('现有')>=0)return '现有';
 if(name.indexOf('调整')>=0)return '日常';
 if(name.indexOf('A级')>=0)return 'A级活动';
 if(name.indexOf('S级')>=0)return 'S级大促';
 return name.replace(/^淘宝/,'');
}

async function deleteProduct(id){if(!confirm('确定删除？'))return;await fetch('/api/products/'+id,{method:'DELETE'});toast('已删除','success');loadProducts();}

function openUploadModal(id,name){
 uploadProductId=id;selectedFile=null;
 document.getElementById('uploadProductName').textContent=name;
 document.getElementById('fileInput').value='';
 document.getElementById('dropZone').querySelector('p').textContent='拖拽文件或点击选择';
 document.getElementById('btnUpload').disabled=true;
 const p=products.find(function(x){return x.id===id;});
 if(p&&p.info_file){document.getElementById('uploadFileStatus').textContent='已有：'+p.info_file.split(/[/\\]/).pop();document.getElementById('btnDeleteFile').style.display='';document.getElementById('btnExtractPoints').style.display='';}
 else{document.getElementById('uploadFileStatus').textContent='暂无资料';document.getElementById('btnDeleteFile').style.display='none';document.getElementById('btnExtractPoints').style.display='none';}
 document.getElementById('uploadProgress').style.display='none';document.getElementById('uploadModal').style.display='';
}
function closeUploadModal(){document.getElementById('uploadModal').style.display='none';}

const dz=document.getElementById('dropZone');dz.addEventListener('click',function(){document.getElementById('fileInput').click();});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.style.borderColor='var(--facai)';dz.style.background='var(--facai-ghost)';});
dz.addEventListener('dragleave',function(){dz.style.borderColor='var(--border)';dz.style.background='';});
dz.addEventListener('drop',function(e){e.preventDefault();dz.style.borderColor='var(--border)';dz.style.background='';if(e.dataTransfer.files.length>0){selectedFile=e.dataTransfer.files[0];dz.querySelector('p').textContent='已选：'+selectedFile.name;document.getElementById('btnUpload').disabled=false;}});
document.getElementById('fileInput').addEventListener('change',function(e){if(e.target.files.length>0){selectedFile=e.target.files[0];dz.querySelector('p').textContent='已选：'+selectedFile.name;document.getElementById('btnUpload').disabled=false;}});
async function uploadFile(){if(!selectedFile||!uploadProductId)return toast('请选文件','error');document.getElementById('uploadProgress').style.display='';document.getElementById('uploadProgress').textContent='上传中，自动提取卖点&hellip;';document.getElementById('btnUpload').disabled=true;const fd=new FormData();fd.append('file',selectedFile);const r=await fetch('/api/products/'+uploadProductId+'/upload',{method:'POST',body:fd});const d=await r.json();if(r.ok){const n=d.data&&d.data.points_extracted?'已提取'+d.data.points_extracted+'条卖点':'已上传';toast(n,'success');closeUploadModal();loadProducts();}else toast('失败','error');document.getElementById('uploadProgress').style.display='none';}
async function deleteFile(){if(!uploadProductId||!confirm('确定删除？'))return;await fetch('/api/products/'+uploadProductId+'/file',{method:'DELETE'});toast('已删除','success');closeUploadModal();loadProducts();}
async function extractPoints(){if(!uploadProductId)return;document.getElementById('uploadProgress').style.display='';document.getElementById('uploadProgress').textContent='AI提取中&hellip;';const r=await fetch('/api/products/'+uploadProductId+'/extract-points',{method:'POST'});const d=await r.json();if(r.ok){toast(d.message,'success');closeUploadModal();loadProducts();}else toast('失败','error');document.getElementById('uploadProgress').style.display='none';}
async function extractAllPoints(){if(!confirm('批量整理所有上传了资料的产品？'))return;const r=await fetch('/api/products/extract-all-points',{method:'POST'});if(r.ok){toast('处理完成','success');loadProducts();}else toast('失败','error');}

loadCategories();loadProducts();
document.addEventListener('DOMContentLoaded',function(){if(window.lucide)lucide.createIcons();});
</script>
</body>
