<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>脚本模板库 — 法采新媒体运营 Agent</title>
<link rel="stylesheet" href="/static/css/style.css?v=canvas-usability-20260716">
<script src="/static/vendor/lucide.min.js"></script>
<link rel="stylesheet" href="/static/css/templates-library.css?v=20260710-modular">
</head>
<body>

<nav class="nav">
<div class="nav-inner">
<div class="nav-brand-group">
<a href="/app" class="nav-brand"><span class="nav-brand-mark"><img src="/static/images/facai-logo.png" alt="法采"></span><span>法采新媒体运营 Agent</span></a>
</div>
<div class="nav-links">
<a href="/app" class="nav-link">AI工作</a><a href="/app/canvas" class="nav-link">产品视觉画布</a><a href="/app/generate" class="nav-link">生成脚本</a><a href="/app/rewrite" class="nav-link">脚本改写</a><a href="/app/products" class="nav-link">产品知识库</a><a href="/app/creators" class="nav-link">达人工作</a><a href="/app/operations" class="nav-link">运营数据中台</a><a href="/app/templates" class="nav-link on">脚本模板库</a><a href="/app/history" class="nav-link">生成历史</a>
<a href="/app/search" class="nav-link">检索</a>
</div></div></nav>

<main class="page-main library-main">
<header class="page-hd library-header">
<div class="library-title-row">
<div>
<h1>脚本模板库</h1>
<div class="library-stats"><span id="countHint">加载中&hellip;</span><span class="stat-chip" id="resultCountHint">当前筛选 0 条</span></div>
</div>
<div class="library-actions">
<button class="btn btn-soft btn-sm" onclick="toggleBatch()" id="batchBtn">批量选择</button>
<button class="btn btn-pri btn-sm" onclick="openUploadModal('facai')">上传法采</button>
<button class="btn btn-soft btn-sm" onclick="openUploadModal('other')">上传其他</button>
</div></div>
</header>

<section class="library-toolbar">
<div class="library-search-panel">
<span class="search-title">语义检索</span>
<input id="semSearch" type="text" placeholder="描述你想找的脚本、场景或卖点..." class="input" style="font-size:13px" onkeydown="if(event.key==='Enter')doSemSearch()">
<div style="display:flex;gap:8px;justify-content:flex-end">
<button class="btn btn-soft btn-sm" id="semSearchBtn" onclick="clearSemSearch()" style="display:none">清除搜索</button>
<button class="btn btn-pri btn-sm" onclick="doSemSearch()">搜索</button>
</div>
</div>
<div class="library-filter-panel">
<div class="filter-section"><span class="filter-label">来源</span><div class="tab-wrap" id="srcTabs"></div></div>
<div class="filter-section"><span class="filter-label">品类</span><div class="tab-wrap" id="catTabs"></div></div>
<div class="filter-section"><span class="filter-label">类型</span><div class="tab-wrap" id="typeTabs"></div></div>
<div class="filter-section"><span class="filter-label">标记</span><div class="tab-wrap"><label class="high-filter" id="highFilterLabel"><input id="highOnlyFilter" type="checkbox" onchange="toggleHigh()">高成交</label><button class="fpill" id="sortBtn" onclick="toggleSort()">最新优先</button></div></div>
</div>
</section>

<div id="batchBar" class="batch-panel">
<span style="font-size:13px">已选 <b id="batchCount">0</b> 个</span>
<div style="display:flex;gap:8px"><button class="btn btn-soft btn-sm" onclick="toggleBatch()">取消</button><button class="btn btn-danger btn-sm" onclick="batchDelete()">批量删除</button></div>
</div>

<section class="script-board">
<div class="list-head">
<div class="list-title"><h2>脚本列表</h2><span class="list-range" id="listRangeHint">加载中&hellip;</span></div>
<div id="topPagination" class="pagination"></div>
</div>
<div id="scriptList" class="script-grid"><div class="empty-state">加载中&hellip;</div></div>
<div id="bottomPagination" class="pagination pagination-bottom"><div id="paginationBar" class="pagination"><button id="pagePrev" class="pager-btn" disabled>‹</button><span id="pageInfo" class="list-range">第 1 页</span><select id="pageSize" class="input" style="width:auto;font-size:13px"><option value="25">25 条/页</option><option value="50">50 条/页</option><option value="100">100 条/页</option></select><span class="pager-jump"><span>跳至</span><input id="pageJumpInput" type="number" min="1" value="1" class="input pager-input" onkeydown="if(event.key==='Enter')jumpToPage()"><span>页</span><button class="pager-btn" onclick="jumpToPage()">跳转</button></span><button id="pageNext" class="pager-btn" disabled>›</button></div></div>
</section>
</main>

<!-- 查看弹窗 -->
<div id="viewModal" class="mo" style="display:none" onclick="if(event.target===this)closeViewModal()">
<div class="mo-box mo-wide script-detail-modal">
<div class="mo-hd"><h3 style="margin:0;font-family:var(--font-serif);font-size:1.1rem" id="modalTitle"></h3><button onclick="closeViewModal()" style="background:none;border:none;font-size:22px;color:var(--text-3);cursor:pointer">&times;</button></div>
<div class="mo-body">
<div class="script-detail-shell">
<section class="script-preview-panel">
<div class="script-preview-tags" id="modalTags"></div>
<div class="script-cake-gallery" id="scriptCakeGallery"></div>
<div class="spv script-preview-content" id="modalScript"></div>
<div class="script-preview-actions">
<button onclick="copyViewScript()" class="btn btn-soft btn-sm">复制</button>
<button onclick="toggleViewHigh()" id="btnToggleHigh" class="btn btn-soft btn-sm">标记高成交</button>
</div>
</section>
<section class="qianchuan-performance-panel">
<div class="qianchuan-panel-head">
<div class="qianchuan-title-block"><div class="qianchuan-title-row"><h4>千川表现</h4><div id="qianchuanBoundSource" class="qianchuan-bound-source empty"><strong>未绑定素材</strong><div class="qianchuan-bound-source-meta"><span>可从候选素材中绑定</span></div></div></div><p>绑定素材后同步脚本跑量表现</p></div>
<div class="qianchuan-actions">
<input id="qianchuanFileInput" type="file" accept=".xlsx" style="position:absolute;width:1px;height:1px;opacity:0" onchange="uploadQianchuanFile(this.files)">
<button class="btn btn-pri btn-sm" onclick="openQianchuanUpload()">新增千川数据表</button>
</div>
</div>
<div class="qianchuan-status" id="qianchuanStatus">等待加载&hellip;</div>
<div class="qianchuan-scroll">
<div id="qianchuanSummary" class="qianchuan-summary-grid"></div>
<div class="qianchuan-section" id="qianchuanBoundSection">
<div class="qianchuan-section-title"><span>已绑定素材</span></div>
<div id="qianchuanBoundList" class="qianchuan-material-list"></div>
</div>
<div class="qianchuan-section" id="qianchuanCandidateSection">
<div class="qianchuan-section-title"><span>候选素材</span><span>点击绑定后才计入脚本表现</span></div>
<div id="qianchuanCandidateList" class="qianchuan-material-list"></div>
</div>
</div>
</section>
</div>
<section class="rewrite-product-bar">
<div class="modal-product-toolbar">
<input id="modalProductSearch" type="text" placeholder="搜产品后选择改写对象&hellip;" class="input" oninput="filterModalProducts()">
</div>
<div id="modalProductList" class="modal-product-list"></div>
<div id="modalRewriteResult" class="spv modal-rewrite-result"></div>
</section>
</div></div></div>

<!-- 上传弹窗 -->
<input id="workbookImportFile" type="file" accept=".xlsx" style="position:absolute;width:1px;height:1px;opacity:0" onchange="importTemplateWorkbook(this.files)">
<div id="uploadModal" class="mo" style="display:none" onclick="if(event.target===this)closeUploadModal()"><div class="mo-box"><div class="mo-hd"><h3 style="margin:0;font-family:var(--font-serif);font-size:1.1rem" id="uploadModalTitle"></h3><button onclick="closeUploadModal()" style="background:none;border:none;font-size:22px;color:var(--text-3);cursor:pointer">&times;</button></div><div class="mo-body" id="uploadFormBody"></div></div></div>

<script src="/static/js/common.js?v=canvas-usability-20260716"></script>
<script src="/static/js/templates-library.js?v=20260710-modular"></script>
</body>
</html>
