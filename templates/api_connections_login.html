<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>API 接入中心登录 · 法采新媒体运营 Agent</title>
  <link rel="stylesheet" href="/static/css/style.css?v=nav-20260710-hardening">
  <link rel="stylesheet" href="/static/css/api-connections.css?v=20260713-shell">
  <script src="/static/vendor/lucide.min.js"></script>
</head>
<body class="integration-login-body">
  <main class="integration-login-page">
    <a class="integration-login-brand" href="/app" aria-label="返回法采新媒体运营 Agent">
      <img src="/static/images/facai-logo.png" alt="法采">
      <span>法采新媒体运营 Agent</span>
    </a>

    <section class="integration-login-panel" aria-labelledby="integrationLoginTitle">
      <div class="integration-login-heading">
        <span class="integration-login-icon" aria-hidden="true"><i data-lucide="plug-zap"></i></span>
        <div>
          <h1 id="integrationLoginTitle">API 接入中心</h1>
          <p>仅限电商数据接入管理员使用</p>
        </div>
      </div>

      {% if not login_ready %}
      <div class="integration-config-alert" role="alert">
        <i data-lucide="shield-alert" aria-hidden="true"></i>
        <div><strong>安全配置未完成</strong><span>管理员密码与会话密钥配置完成后才能登录。</span></div>
      </div>
      {% endif %}

      <form id="integrationLoginForm" class="integration-login-form" data-next="{{ next_path }}" novalidate>
        <label for="integrationPassword">管理员密码</label>
        <div class="integration-password-field">
          <i data-lucide="lock-keyhole" aria-hidden="true"></i>
          <input id="integrationPassword" name="password" type="password" autocomplete="current-password" maxlength="512" required {% if not login_ready %}disabled{% endif %}>
        </div>
        <div id="integrationLoginError" class="integration-login-error" role="alert" hidden></div>
        <div id="integrationLoginStatus" class="integration-login-status" aria-live="polite"></div>
        <button id="integrationLoginSubmit" class="btn btn-pri" type="submit" {% if not login_ready %}disabled{% endif %}>
          <i data-lucide="log-in" aria-hidden="true"></i><span>进入接入中心</span>
        </button>
      </form>

      <a class="integration-login-return" href="/app"><i data-lucide="arrow-left" aria-hidden="true"></i>返回 AI 工作台</a>
    </section>
  </main>
  <script src="/static/js/api-connections-login.js?v=20260713-shell"></script>
</body>
</html>
